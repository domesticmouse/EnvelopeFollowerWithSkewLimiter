name: Build & Deploy Documentation Site

on:
  push:
    branches: [main]
    paths-ignore:
      - 'AGENTS.md'
      - '.agents/**'
      - 'docs/agents/**'
      - 'docs/research/**'
      - 'skills-lock.json'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'AGENTS.md'
      - '.agents/**'
      - 'docs/agents/**'
      - 'docs/research/**'
      - 'skills-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build, test & verify static site
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Typecheck Astro templates and TypeScript
        working-directory: site
        run: npm run typecheck

      - name: Run unit tests
        working-directory: site
        run: npm test

      - name: Build static site & Pagefind index
        working-directory: site
        run: npm run build

      - name: Verify built-site contract (25 routes, passthroughs, Pagefind, README links)
        working-directory: site
        run: npm run check

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
